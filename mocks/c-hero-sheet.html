<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umi モックC 水面＋シート</title>
<link rel="stylesheet" href="common.css">
<style>
  .hero { height: 62vh; display: flex; align-items: flex-end; padding: 0 clamp(16px, 5vw, 64px) 26px; }
  .float { width: min(460px, 100%); padding: 18px 20px; }
  .float .k { font-size: 11px; letter-spacing: .16em; color: var(--navy); font-weight: 700; }
  .float h2 { margin: 6px 0 4px; font-size: 22px; }
  .float p { margin: 0; color: var(--sub); font-size: 13px; line-height: 1.7; }
  .float .go { margin-top: 12px; display: flex; gap: 8px; }
  .float .go span { font-size: 13px; padding: 7px 14px; border-radius: 99px; background: var(--navy); color: #fff; }
  .float .go span + span { background: rgba(15,34,54,.07); color: var(--ink); }
  .sheet { background: #f7f9fb; border-radius: 22px 22px 0 0; min-height: 100vh; padding: 22px clamp(16px, 5vw, 64px) 60vh;
    box-shadow: 0 -10px 40px rgba(0,20,40,.18); }
  .grab { width: 44px; height: 5px; border-radius: 9px; background: #cfd8e0; margin: -8px auto 16px; }
  .top { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start; }
  .tl h3, .lists h3 { font-size: 14px; margin: 0 0 10px; }
  .slot { display: grid; grid-template-columns: 48px 1fr; gap: 10px; font-size: 13px; min-height: 42px; border-top: 1px dashed #dde3e8; padding-top: 6px; color: var(--sub); }
  .blk { border-radius: 8px; padding: 6px 10px; color: var(--ink); font-size: 13px; }
  .blk.must { background: rgba(194,65,45,.1); border-left: 3px solid var(--must); }
  .blk.self { background: rgba(47,111,143,.1); border-left: 3px solid var(--self); }
  .box { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; border: 1px solid var(--line); }
  @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/", "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.6/build/index.js" } }</script>
</head><body>
<section id="dive">
  <div id="stage"><canvas id="scene"></canvas></div>
  <div>
    <div class="hero">
      <div class="glass float">
        <div class="k">いまの一つ・11月26日（木）</div>
        <h2 id="fT"></h2><p id="fN"></p>
        <div class="go"><span>はじめる</span><span>あとで</span></div>
      </div>
    </div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="add" style="margin-bottom:18px"><b>＋</b><span>タスクを追加　例：明日15時 統計の課題 #大学</span><kbd>Ctrl K</kbd></div>
      <div class="top">
        <div class="tl box">
          <h3>今日の潮位　3時間30分 ／ 5時間</h3>
          <div class="slot"><span>9:00</span><div class="blk must">TIEカードの予約を取る</div></div>
          <div class="slot"><span>10:00</span><div class="blk must">統計学の課題を提出する</div></div>
          <div class="slot"><span>11:00</span><div></div></div>
          <div class="slot"><span>14:00</span><div class="blk must">Cypher 定例の議事録</div></div>
          <div class="slot"><span>16:00</span><div class="blk self">Umi のダッシュボードを確認する</div></div>
          <div class="slot"><span>21:00</span><div class="blk self">スペイン語の単語を20個</div></div>
        </div>
        <div class="lists">
          <div class="box"><div class="sec"><span class="depth">SHALLOWS</span><h3>浅瀬　今週</h3></div><div id="s2"></div></div>
          <div class="box"><div class="sec"><span class="depth">DEPTHS</span><h3>深み　いつか</h3></div><div id="s3"></div></div>
          <div class="box"><div class="sec"><span class="depth">LAKE BED</span><h3>湖底　終えたもの</h3></div><div id="s4"></div></div>
        </div>
      </div>
    </div>
  </div>
</section>
<div class="mocklabel">モックC：水面の上に「いまの一つ」＋下から引き上げるシート（Sunsama 風）</div>
<script src="sample.js"></script>
<script>
  fT.textContent = SAMPLE.focus.title; fN.textContent = SAMPLE.focus.note;
  renderRows(s2, 'shallows', { noArea: true }); renderRows(s3, 'depths', { noArea: true }); renderRows(s4, 'bed');
</script>
<script src="../env.js"></script>
<script type="module" src="../scene.js"></script>
<script src="mockjump.js"></script>
</body></html>
