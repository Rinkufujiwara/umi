<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umi — table</title>
<link rel="stylesheet" href="app.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.6/build/index.js"
} }
</script>
</head>
<body>
<section id="dive">
  <div id="stage" aria-hidden="true"><canvas id="scene"></canvas><div class="loading"></div></div>

  <div class="app">
    <nav class="side glass" data-i18n-attr="aria-label:L.areasNav">
      <div class="brand"><i></i>Umi</div>
      <a class="nav back" href="./" data-i18n="L.back">← Back to the lake</a>
      <button class="nav on" data-area=""><span data-i18n="L.allAreas">All areas</span> <span class="c" id="cAll"></span></button>
      <h4 data-i18n="L.areas">Areas</h4>
      <div id="areaList"></div>
      <form class="areaAdd" id="areaAdd"><input id="areaName" data-i18n-attr="placeholder:L.newArea,aria-label:L.newAreaAria"></form>
      <h4 data-i18n="L.depth">Depth</h4>
      <button class="nav" data-jump="surface"><span data-i18n="L.surface">Surface  today</span> <span class="c" id="cSurface"></span></button>
      <button class="nav" data-jump="shallows"><span data-i18n="L.shallows">Shallows  this week</span> <span class="c" id="cShallows"></span></button>
      <button class="nav" data-jump="depths"><span data-i18n="L.depths">Depths  someday</span> <span class="c" id="cDepths"></span></button>
      <button class="nav" data-jump="bed"><span data-i18n="L.bed">Lakebed  finished</span> <span class="c" id="cBed"></span></button>
      <div class="tools">
        <button id="clearSample" hidden data-i18n="L.clearSample">Remove sample tasks</button>
        <button id="exportBtn" data-i18n="L.export">Export data</button>
        <label><span data-i18n="L.import">Import data</span><input type="file" id="importFile" accept="application/json" hidden></label>
      </div>
    </nav>

    <main class="main">
      <div class="chips" id="chips"></div>
      <div class="card glass">
        <div class="head"><h1 data-i18n="L.today">Today</h1><span class="date" id="today"></span></div>
        <form class="addf" id="addForm">
          <b aria-hidden="true">＋</b>
          <input id="addInput" autocomplete="off" data-i18n-attr="placeholder:L.addPh,aria-label:L.addAria">
          <kbd>Ctrl K</kbd>
        </form>
        <div class="preview" id="preview"></div>
        <div class="tide" id="tide">
          <div class="lab"><span id="tideText"></span><span class="rest" id="tideRest"></span></div>
          <div class="bar"><div class="fill" id="tideFill"></div></div>
        </div>
      </div>

      <div class="card glass focus" id="focus"></div>

      <section class="card glass" id="sec-surface"><div class="sec"><span class="depth">SURFACE</span><h3 data-i18n="L.surface">Surface  today</h3><span class="n" id="nSurface"></span></div><div class="list" id="L-surface" data-sec="surface"></div></section>
      <section class="card glass" id="sec-shallows"><div class="sec"><span class="depth">SHALLOWS</span><h3 data-i18n="L.shallows">Shallows  this week</h3><span class="n" id="nShallows"></span></div><div class="list" id="L-shallows" data-sec="shallows"></div></section>
      <section class="card glass" id="sec-depths"><div class="sec"><span class="depth">DEPTHS</span><h3 data-i18n="L.depths">Depths  someday</h3><span class="n" id="nDepths"></span></div><div class="list" id="L-depths" data-sec="depths"></div></section>
      <section class="card glass bed" id="sec-bed"><div class="sec"><span class="depth">LAKE BED</span><h3 data-i18n="L.bed">Lakebed  finished</h3><span class="n" id="nBed"></span></div><div class="list" id="L-bed"></div></section>
    </main>
  </div>
</section>

<div class="env">
  <button id="envBtn" aria-expanded="false" data-i18n="L.env">Lake &amp; settings</button>
  <div class="envMenu glass" id="envMenu">
    <p class="lbl" data-i18n="L.season">Season</p>
    <div class="row2" id="seasonBtns"></div>
    <p class="lbl" data-i18n="L.weather">Sky and water</p>
    <div class="row2" id="weatherBtns"></div>
  </div>
</div>
<div class="depthbar" aria-hidden="true"><i id="dDot"></i><span id="dTxt">Surface</span></div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastUndo" data-i18n="toast.undo">Undo</button></div>

<script src="env.js"></script>
<script type="module" src="scene.js"></script>
<script type="module" src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script>
  if (window.Lenis && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    window.__lenis = new Lenis({ lerp: 0.09, wheelMultiplier: 0.9 });
    (function raf(t) { window.__lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
  }
</script>
</body>
</html>
