<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umi</title>
<link rel="stylesheet" href="home.css?v=19">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="湖。浮かんでいるブイがタスクです"></canvas>
<div class="loading"></div>
<div class="fade" id="fade"></div>
<svg id="tagSvg" aria-hidden="true"><path id="tagLines"/></svg>
<div id="tags"></div>
<div class="hold" id="hold" aria-hidden="true"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18"/></svg></div>

<nav class="side glass" aria-label="メニュー">
  <i class="ind" id="navInd" aria-hidden="true"></i>
  <div class="brand">Umi</div>
  <button class="nav on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button class="nav" data-go="map" title="空から見る"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>一覧</button>
  <button class="nav" data-go="bed" title="終えたタスク"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/></svg>湖底</button>
  <button class="nav" data-dive-open title="ひとつのタスクに潜る（集中タイマー）"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>ダイブ</button>
  <div class="grow"></div>
  <div class="account" id="account"></div>
  <button class="nav" id="envNav"><svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><span>湖のようす</span><small id="envSmall" hidden></small></button>
</nav>

<div class="top" id="top">
  <div class="hdr">
    <div class="greet">
      <h1 id="hello">こんにちは</h1>
      <p class="meta" id="summary"></p>
    </div>
    <div class="acts">
      <div class="tide" id="tide" title="今日の見積もりの合計 ／ 1日に使える時間"></div>
      <button class="calm" id="calmBtn" aria-pressed="false" title="オンにすると、いまやる3件だけを浮かべます"><span class="sw"><i></i></span><b>凪モード</b></button>
      <button class="addbtn" id="addBtn">＋ タスクを追加</button>
    </div>
  </div>
  <div class="row">
    <section class="panel glass"><h2>今日の優先タスク</h2><div class="cards" id="cards"></div></section>
    <section class="panel glass focus"><h2>いまの一つ</h2><div id="focus"></div></section>
  </div>
</div>

<div class="axis" id="axis" hidden></div>
<div class="bedhint" id="bedhint" title="下へスクロールで湖底へ"><b id="bedCount">湖底</b><span class="arrow" aria-hidden="true">↓</span></div>
<div class="ticks" id="ticks"><i style="top:30%">-10m</i><i style="top:62%">-30m</i></div>

<div class="mapview" id="mapview">
  <h1>一覧　空から見る</h1>
  <p class="sub" id="mapSub"></p>
  <div class="legend"><span>← 急ぐ　　余裕 →</span><span>↑ 軽い（陸側）　　重い（沖）↓</span></div>
  <div class="levels"><button class="calm small" data-calm aria-pressed="false" title="オンにすると、いまやる3件だけを浮かべます"><span class="sw"><i></i></span><b>凪モード</b></button><a class="btn" href="list.html">表で見る</a><button class="btn" data-go="home">水面へ戻る</button></div>
</div>
<div class="bedview" id="bedview">
  <h1 id="bedTitle">湖底・今日</h1>
  <p class="sub" id="bedSub"></p>
  <div class="levels" id="bedLevels"></div>
  <div class="list glass" id="bedList"></div>
</div>

<div class="pop glass" id="pop"></div>
<div class="scrim" id="scrim"></div>
<div class="addbox glass" id="addbox" role="dialog" aria-label="タスクを追加">
  <div class="addhead"><b>タスクを追加</b><span><kbd>Enter</kbd> 浮かべる　<kbd>Esc</kbd> 閉じる</span></div>
  <form id="addForm"><input id="addInput" autocomplete="off" placeholder="例：明日15時 統計の課題 #大学 1時間 必須" aria-label="タスク"><button class="btn pri">浮かべる</button></form>
  <div class="pv" id="pv"></div>
  <div class="quick" id="quick"></div>
</div>
<div class="pop glass" id="envMenu" style="left:240px;bottom:24px"></div>
<div class="dive" id="dive" hidden>
  <div class="dsetup glass" id="dSetup" role="dialog" aria-label="ダイブ">
    <div class="addhead"><b>ダイブ</b><span>ひとつのタスクに潜る</span></div>
    <label class="dlab">潜る先<select id="dTask"></select></label>
    <div class="dlab">時間</div>
    <div class="dmodes" id="dModes"><button type="button" data-m="25">25分</button><button type="button" data-m="50">50分</button><button type="button" data-m="0">決めない</button></div>
    <p class="dnote" id="dNote"></p>
    <div class="go"><button class="btn" id="dCancel" type="button">やめる</button><button class="btn pri" id="dStart" type="button">潜る</button></div>
  </div>
  <div class="dhud" id="dHud">
    <div class="dtask" id="dTaskName"></div>
    <div class="dtime" id="dTime">25:00</div>
    <div class="dsub2" id="dSub"></div>
    <form id="dBubbleForm" autocomplete="off"><input id="dBubble" placeholder="浮かんだ考えは、ここに書いて Enter（泡になって上っていきます）" aria-label="泡メモ"></form>
    <button class="btn" id="dUp" type="button">浮上する</button>
  </div>
  <div class="dgauge" id="dGauge" aria-hidden="true"><i id="dDepth"></i><span id="dDepthTxt">0m</span></div>
  <div class="drest glass" id="dRest" role="dialog" aria-label="減圧">
    <div class="addhead"><b>浮上しました</b><span id="dSummary"></span></div>
    <div class="breath"><div class="ring"><i></i></div><div><b id="dRestTime">減圧 5:00</b><p id="dBreathTxt">波に合わせて、ゆっくり吸って、吐いて</p></div></div>
    <div id="dBubbles"></div>
    <div class="go"><button class="btn pri" id="dSink" type="button">沈める（終わった）</button><button class="btn" id="dAgain" type="button">もう一度潜る</button><button class="btn" id="dHome" type="button">水面へ戻る</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastUndo">元に戻す</button></div>

<script src="env.js?v=19"></script>
<script src="firebase-config.js?v=19"></script>
<script type="module" src="home.js?v=19"></script>
</body>
</html>
