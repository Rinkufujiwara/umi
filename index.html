<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umi</title>
<link rel="stylesheet" href="home.css?v=50b">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<!-- Text here is English; i18n.js swaps it for the chosen language (data-i18n / data-i18n-attr). -->
<canvas id="scene" data-i18n-attr="aria-label:scene.label" aria-label="The lake. Each floating buoy is a task."></canvas>
<div class="loading"></div>
<div class="fade" id="fade"></div>
<svg id="tagSvg" aria-hidden="true"><path id="tagLines"/></svg>
<div id="tags"></div>
<button id="askQ" class="askq" data-ask type="button" aria-label="Shiomi has a question">?</button>
<div class="hold" id="hold" aria-hidden="true"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18"/></svg></div>

<nav class="side glass" data-i18n-attr="aria-label:nav.menu" aria-label="Menu">
  <i class="ind" id="navInd" aria-hidden="true"></i>
  <div class="brand">Umi</div>
  <button class="nav on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home">Home</span></button>
  <button class="nav" data-go="map" data-i18n-attr="title:nav.map.title" title="View from the sky"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="nav.map">Overview</span></button>
  <button class="nav" data-go="bed" data-i18n-attr="title:nav.bed.title" title="Finished tasks"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/></svg><span data-i18n="nav.bed">Lakebed</span></button>
  <button class="nav" data-dive-open data-i18n-attr="title:nav.dive.title" title="Dive into one task (focus timer)"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg><span data-i18n="nav.dive">Dive</span></button>
  <div class="grow"></div>
  <div class="account" id="account"></div>
  <button class="nav" id="envNav"><svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><span data-i18n="nav.env">Lake &amp; settings</span><small id="envSmall" hidden></small></button>
</nav>

<div class="top" id="top">
  <div class="hdr">
    <div class="greet">
      <h1 id="hello">Hello</h1>
      <p class="meta" id="summary"></p>
    </div>
    <div class="acts">
      <div class="tide" id="tide" data-i18n-attr="title:tide.title"></div>
      <button class="calm" id="calmBtn" aria-pressed="false" data-i18n-attr="title:calm.title"><span class="sw"><i></i></span><b data-i18n="calm">Nagi mode</b></button>
      <button class="addbtn" id="addBtn">＋&nbsp;<span class="long" data-i18n="add.title">Add a task</span><span class="short" data-i18n="add">Add</span></button>
    </div>
  </div>
  <div class="row">
    <section class="panel glass"><h2><span data-i18n="panel.top">Today's priorities</span><span class="sum" id="sumTop"></span><button class="fold" type="button" data-fold aria-expanded="true" data-i18n-attr="title:fold.title,aria-label:fold.title"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></h2><div class="cards" id="cards"></div></section>
    <section class="panel glass focus"><h2><span data-i18n="panel.focus">The one for now</span><span class="sum" id="sumFocus"></span><button class="fold" type="button" data-fold aria-expanded="true" data-i18n-attr="title:fold.title,aria-label:fold.title"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></h2><div id="focus"></div></section>
  </div>
</div>

<div class="axis" id="axis" hidden></div>
<div class="bedhint" id="bedhint" data-i18n-attr="title:bed.hint.title" role="button" tabindex="0" data-go="bed"><b id="bedCount">Lakebed</b><span class="arrow" aria-hidden="true">↓</span></div>
<div class="ticks" id="ticks"><i style="top:30%">-10m</i><i style="top:62%">-30m</i></div>

<div class="mapview" id="mapview">
  <h1 data-i18n="map.title">Overview  from the sky</h1>
  <p class="sub" id="mapSub"></p>
  <div class="legend"><span data-i18n="map.legendX">← Urgent    Slack →</span><span data-i18n="map.legendY">↑ Light (shore)    Heavy (offshore) ↓</span></div>
  <div class="levels"><button class="calm small" data-calm aria-pressed="false" data-i18n-attr="title:calm.title"><span class="sw"><i></i></span><b data-i18n="calm">Nagi mode</b></button><a class="btn" href="list.html" data-i18n="map.table">Table view</a><button class="btn" data-go="home" data-i18n="bed.back">Back to the surface</button></div>
</div>
<div class="bedview" id="bedview">
  <h1 id="bedTitle" data-i18n="bed.default">Lakebed</h1>
  <p class="sub" id="bedSub"></p>
  <div class="levels" id="bedLevels"></div>
  <div class="list glass" id="bedList"></div>
</div>

<div class="pop glass" id="pop"></div>
<div class="scrim" id="scrim"></div>
<div class="addbox glass" id="addbox" role="dialog" data-i18n-attr="aria-label:addbox.title">
  <div class="addhead"><b data-i18n="addbox.title">Add a task</b><span><kbd>Enter</kbd> <span data-i18n="addbox.enter">float</span>　<kbd>Esc</kbd> <span data-i18n="addbox.esc">close</span></span></div>
  <form id="addForm"><input id="addInput" autocomplete="off" data-i18n-attr="placeholder:addbox.placeholder,aria-label:addbox.aria"><button class="btn pri" data-i18n="addbox.float">Float</button></form>
  <div class="pv" id="pv"></div>
  <div class="quick" id="quick"></div>
</div>
<div class="pop glass" id="envMenu" style="left:240px;bottom:24px"></div>
<nav class="mbar glass" data-i18n-attr="aria-label:nav.menu">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home">Home</span></button>
  <button data-go="map"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="nav.map">Overview</span></button>
  <button data-go="bed"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/></svg><span data-i18n="nav.bed">Lakebed</span></button>
  <button data-dive-open><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg><span data-i18n="nav.dive">Dive</span></button>
  <button id="mEnv"><svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><span data-i18n="nav.settings">Settings</span></button>
</nav>
<div class="dive" id="dive" hidden>
  <div class="dsetup glass" id="dSetup" role="dialog" data-i18n-attr="aria-label:dive">
    <div class="addhead"><b data-i18n="dive">Dive</b><span data-i18n="dive.sub">Dive into one task</span></div>
    <label class="dlab"><span data-i18n="dive.target">Dive into</span><select id="dTask"></select></label>
    <div class="dlab" data-i18n="dive.time">Time</div>
    <div class="seg dmodes" data-seg="dive" id="dModes"><button type="button" data-m="25" class="dmin">25 min</button><button type="button" data-m="50" class="dmin">50 min</button><button type="button" data-m="0" data-i18n="dive.open">No limit</button></div>
    <p class="dnote" id="dNote"></p>
    <div class="go"><button class="btn quiet" id="dCancel" type="button" data-i18n="dive.cancel">Cancel</button><button class="btn pri" id="dStart" type="button" data-i18n="dive.start">Dive</button></div>
  </div>
  <div class="dhud" id="dHud">
    <div class="dtask" id="dTaskName"></div>
    <div class="dtime" id="dTime">25:00</div>
    <div class="dsub2" id="dSub"></div>
    <form id="dBubbleForm" autocomplete="off"><input id="dBubble" data-i18n-attr="placeholder:dive.bubble,aria-label:dive.bubbleAria"></form>
    <button class="btn" id="dUp" type="button" data-i18n="dive.up">Surface</button>
  </div>
  <div class="dgauge" id="dGauge" aria-hidden="true"><i id="dDepth"></i><span id="dDepthTxt">0m</span></div>
  <div class="drest glass" id="dRest" role="dialog" data-i18n-attr="aria-label:dive.surfaced">
    <div class="addhead"><b data-i18n="dive.surfaced">Surfaced</b><span id="dSummary"></span></div>
    <div class="breath"><div class="ring"><i></i></div><div><b id="dRestTime"></b><p id="dBreathTxt"></p></div></div>
    <div id="dBubbles"></div>
    <div class="go"><button class="btn pri" id="dSink" type="button" data-i18n="dive.sink">Sink (done)</button><button class="btn" id="dAgain" type="button" data-i18n="dive.againBtn">Dive again</button><button class="btn quiet" id="dHome" type="button" data-i18n="dive.home">Back to the surface</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastUndo" data-i18n="toast.undo">Undo</button></div>

<script src="env.js?v=50"></script>
<script src="firebase-config.js?v=50"></script>
<script type="module" src="home.js?v=50"></script>
</body>
</html>
